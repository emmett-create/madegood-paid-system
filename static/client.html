<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MadeGood — Creator Review</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    :root { --red:#CA0100; --bg:#F8F5ED; --panel:#fff; --panel2:#F2EDE9; --border:#DDD5CE; --text:#1A0000; --dim:#8a7070; --green:#1a7a1a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:13px; }
    .gate { position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000; }
    .gate-box { background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px;width:340px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 4px 24px rgba(26,0,0,.08); }
    .gate-sub { color:var(--dim);font-size:13px; }
    .gate-err { color:var(--red);font-size:12px; }
    .hidden { display:none!important; }
    .header { background:#1A0000;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:100; }
    .header-inner { max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px; }
    .header-sub { color:#F8F5ED;opacity:.6;font-size:12px; }
    .logo-img { height:26px; }
    .container { max-width:1100px;margin:0 auto;padding:24px; }
    h2 { font-size:18px;font-weight:700;margin-bottom:4px; }
    .sub { color:var(--dim);font-size:12px;margin-bottom:20px; }
    .tbl-wrap { background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow-x:auto; }
    table { width:100%;border-collapse:collapse;font-size:13px; }
    th { background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap; }
    td { padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF7F4; }
    a { color:var(--red);text-decoration:none; }
    .badge { display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600; }
    .badge-int { background:#ede8f5;color:#6b3fa0;border:1px solid #c5b0e0; }
    input[type=checkbox] { accent-color:var(--green);width:16px;height:16px;cursor:pointer; }
    input[type=text] { background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:12px;width:100%; }
    .btn { background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer; }
    .empty { text-align:center;color:var(--dim);padding:40px; }
    .search-row { display:flex;gap:10px;margin-bottom:16px; }
    .search-box { background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;min-width:260px; }
  </style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <img src="/logo.png" alt="Agency 8" style="height:30px;align-self:center">
    <div class="gate-sub">MadeGood Creator Review</div>
    <input type="password" id="gate-pw" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="gate-btn">Enter</button>
    <div class="gate-err hidden" id="gate-err">Wrong password</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="header">
    <div class="header-inner">
      <img src="/logo.png" alt="Agency 8" class="logo-img">
      <span class="header-sub">MadeGood Creator Review</span>
    </div>
  </header>

  <div class="container">
    <h2>Creator Review</h2>
    <p class="sub">Check the box next to any creator you'd like to approve. Add notes in the Notes column.</p>

    <div class="search-row">
      <input type="search" class="search-box" id="cl-search" placeholder="Search name, handle…">
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Approved</th>
            <th>Name</th>
            <th>IG Handle</th>
            <th>TT Handle</th>
            <th>Followers</th>
            <th>Tier</th>
            <th>Vertical</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="cl-body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = n => n != null ? Number(n).toLocaleString() : "—";
let allRows = [];

document.getElementById("gate-btn").addEventListener("click", async () => {
  const pw = document.getElementById("gate-pw").value.trim();
  const r  = await fetch("/api/auth/client", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({password: pw})
  });
  if (r.ok) {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadCreators();
  } else {
    document.getElementById("gate-err").classList.remove("hidden");
  }
});
document.getElementById("gate-pw").addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("gate-btn").click(); });

document.getElementById("cl-search").addEventListener("input", renderCreators);

async function loadCreators() {
  const data = await fetch("/api/client/influencers").then(r=>r.json());
  allRows = data || [];
  renderCreators();
}

function renderCreators() {
  const search = document.getElementById("cl-search").value.toLowerCase();
  let rows = allRows;
  if (search) rows = rows.filter(r => `${r.name} ${r.ig_handle} ${r.tt_handle}`.toLowerCase().includes(search));

  const iS = "background:#F2EDE9;border:1px solid #DDD5CE;color:#1A0000;border-radius:5px;padding:3px 8px;font-size:12px;width:100%";
  document.getElementById("cl-body").innerHTML = rows.length ? rows.map(r => `<tr>
    <td style="text-align:center">
      <input type="checkbox" class="cl-approved" data-id="${r.id}" ${r.client_approved?"checked":""}>
    </td>
    <td><strong>${esc(r.name||"")}</strong></td>
    <td>${r.ig_handle ? `<a href="https://instagram.com/${esc(r.ig_handle)}" target="_blank">@${esc(r.ig_handle)}</a>` : "—"}</td>
    <td>${r.tt_handle ? `<a href="https://tiktok.com/@${esc(r.tt_handle)}" target="_blank">@${esc(r.tt_handle)}</a>` : "—"}</td>
    <td style="color:#8a7070">${fmt(r.ig_followers)}</td>
    <td>${r.tier ? `<span class="badge badge-int">${esc(r.tier)}</span>` : "—"}</td>
    <td style="font-size:11px">${esc(r.vertical||r.archetype||"")}</td>
    <td><input type="text" class="cl-notes" data-id="${r.id}" value="${esc(r.client_notes||"")}" placeholder="Notes…" style="${iS}"></td>
  </tr>`).join("") : `<tr><td colspan="8" class="empty">No creators yet.</td></tr>`;

  document.querySelectorAll(".cl-approved").forEach(cb =>
    cb.addEventListener("change", async () => {
      await fetch(`/api/client/influencers/${cb.dataset.id}`, {
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({client_approved: cb.checked})
      });
      const row = allRows.find(r => String(r.id) === cb.dataset.id);
      if (row) row.client_approved = cb.checked;
    })
  );
  document.querySelectorAll(".cl-notes").forEach(inp =>
    inp.addEventListener("blur", async () => {
      await fetch(`/api/client/influencers/${inp.dataset.id}`, {
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({client_notes: inp.value.trim() || null})
      });
    })
  );
}
</script>
</body>
</html>
