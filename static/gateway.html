<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agency 8 — Paid System</title>
  <style>
    :root { --red:#CA0100; --bg:#F8F5ED; --panel:#fff; --border:#DDD5CE; --text:#1A0000; --dim:#8a7070; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .box { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:40px; width:340px; display:flex; flex-direction:column; gap:14px; text-align:center; box-shadow:0 4px 24px rgba(26,0,0,.08); }
    img { height:32px; align-self:center; }
    .sub { color:var(--dim); font-size:13px; }
    .err { color:var(--red); font-size:12px; display:none; }
    input { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; font-size:13px; width:100%; }
    .btn { background:var(--red); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; width:100%; }
    .btn:hover { filter:brightness(1.1); }
  </style>
</head>
<body>
  <div class="box">
    <img src="/logo.png" alt="Agency 8">
    <div class="sub">Agency 8 Paid System</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="btn">Enter</button>
    <div class="err" id="err">Wrong password</div>
  </div>
  <script>
    async function tryLogin() {
      const pw = document.getElementById("pw").value.trim();
      const r = await fetch("/api/auth", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({password: pw})
      });
      if (r.ok) {
        window.location.href = "/hub";
      } else {
        document.getElementById("err").style.display = "block";
      }
    }
    document.getElementById("btn").addEventListener("click", tryLogin);
    document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") tryLogin(); });
  </script>
</body>
</html>
